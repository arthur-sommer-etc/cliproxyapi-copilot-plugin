name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build marketplace package
        run: make package-${{ matrix.platform }} VERSION=${{ needs.validate.outputs.version }}

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/cliproxyapi-copilot_${{ needs.validate.outputs.version }}_*.zip
            dist/checksums.txt
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/packages

      - name: Assemble release assets
        run: |
          find dist/packages -name 'cliproxyapi-copilot_*.zip' -exec cp {} dist/ \;
          find dist/packages -name checksums.txt -exec cat {} + | sort > dist/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/cliproxyapi-copilot_${{ needs.validate.outputs.version }}_linux_amd64.zip \
            dist/cliproxyapi-copilot_${{ needs.validate.outputs.version }}_linux_arm64.zip \
            dist/cliproxyapi-copilot_${{ needs.validate.outputs.version }}_darwin_amd64.zip \
            dist/cliproxyapi-copilot_${{ needs.validate.outputs.version }}_darwin_arm64.zip \
            dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  package-darwin:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: true

      - name: Install pinned Task
        run: |-
          mkdir -p "$RUNNER_TEMP/task-bin"
          go -C tools build -o "$RUNNER_TEMP/task-bin/task" github.com/go-task/task/v3/cmd/task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Validate release tag
        id: version
        shell: bash
        run: |-
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="$(packaging/package-release.sh --validate-version "$version")"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and package production plugin
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: task package-darwin VERSION="$VERSION"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: cliproxyapi-copilot-darwin-arm64
          path: |
            dist/cliproxyapi-copilot_*_darwin_arm64.zip
            dist/checksums.txt
          if-no-files-found: error

  release:
    needs: package-darwin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        shell: bash
        run: |-
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="$(packaging/package-release.sh --validate-version "$version")"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: true

      - name: Install pinned Task
        run: |-
          mkdir -p "$RUNNER_TEMP/task-bin"
          go -C tools build -o "$RUNNER_TEMP/task-bin/task" github.com/go-task/task/v3/cmd/task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: task test

      - name: Build marketplace package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: task package VERSION="$VERSION"

      - name: Run synthetic native host tests
        run: task test-native

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: cliproxyapi-copilot-darwin-arm64
          path: dist/darwin

      - name: Combine package checksums
        run: |-
          cat dist/darwin/checksums.txt >> dist/checksums.txt
          mv dist/darwin/cliproxyapi-copilot_${{ steps.version.outputs.value }}_darwin_arm64.zip dist/

      - name: Validate release Git state
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: packaging/validate-release-git.sh

      - name: Publish GitHub Release with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.0
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}

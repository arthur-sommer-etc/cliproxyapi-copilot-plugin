name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package production plugin
        run: make package VERSION=0.0.0

      - name: Run synthetic native host tests
        run: make test-native

      - name: Upload package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cliproxyapi-copilot-linux-amd64
          path: |
            dist/cliproxyapi-copilot_0.0.0_linux_amd64.zip
            dist/checksums.txt
          if-no-files-found: error

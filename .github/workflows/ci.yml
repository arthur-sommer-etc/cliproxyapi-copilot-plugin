name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run tests
        run: go test ./...

  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run platform tests
        run: go test ./...

      - name: Build and package production plugin
        run: make package-${{ matrix.platform }} VERSION=0.0.0

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cliproxyapi-copilot-${{ matrix.platform }}
          path: |
            dist/cliproxyapi-copilot_0.0.0_*.zip
            dist/checksums.txt
          if-no-files-found: error

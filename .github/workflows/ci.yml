name: CI

on:
  pull_request:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm

      - name: Install contributor tooling
        run: pnpm install --frozen-lockfile

      - name: Check formatting and documentation
        run: pnpm exec run-p check:go-format check:go-vet check:markdownlint-cli2

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and package production plugin
        run: make package VERSION=0.0.0

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: cliproxyapi-copilot-linux-amd64
          path: |
            dist/cliproxyapi-copilot_0.0.0_linux_amd64.zip
            dist/checksums.txt
          if-no-files-found: error

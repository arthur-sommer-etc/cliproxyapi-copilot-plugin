name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install contributor tooling
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package production plugin
        run: make package VERSION=0.0.0

      - name: Run synthetic native host tests
        run: make test-native

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: cliproxyapi-copilot-linux-amd64
          path: |
            dist/cliproxyapi-copilot_0.0.0_linux_amd64.zip
            dist/checksums.txt
          if-no-files-found: error

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: true

      - name: Install pinned Task
        run: |
          mkdir -p "$RUNNER_TEMP/task-bin"
          go -C tools build -o "$RUNNER_TEMP/task-bin/task" github.com/go-task/task/v3/cmd/task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install contributor tooling
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: true

      - name: Install pinned Task
        run: |
          mkdir -p "$RUNNER_TEMP/task-bin"
          go -C tools build -o "$RUNNER_TEMP/task-bin/task" github.com/go-task/task/v3/cmd/task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: task test

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: true

      - name: Install pinned Task
        run: |
          mkdir -p "$RUNNER_TEMP/task-bin"
          go -C tools build -o "$RUNNER_TEMP/task-bin/task" github.com/go-task/task/v3/cmd/task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Build and package production plugin
        run: task package VERSION=0.0.0

      - name: Run synthetic native host tests
        run: task test-native

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: cliproxyapi-copilot-linux-amd64
          path: |
            dist/cliproxyapi-copilot_0.0.0_linux_amd64.zip
            dist/checksums.txt
          if-no-files-found: error

  package-darwin:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: true

      - name: Install pinned Task
        run: |
          mkdir -p "$RUNNER_TEMP/task-bin"
          go -C tools build -o "$RUNNER_TEMP/task-bin/task" github.com/go-task/task/v3/cmd/task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Build and package production plugin
        run: task package-darwin VERSION=0.0.0

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: cliproxyapi-copilot-darwin-arm64
          path: |
            dist/cliproxyapi-copilot_0.0.0_darwin_arm64.zip
            dist/checksums.txt
          if-no-files-found: error

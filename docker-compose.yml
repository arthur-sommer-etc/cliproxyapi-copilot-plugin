name: cliproxyapi-official-copilot-dev

services:
  cliproxyapi:
    platform: linux/amd64
    image: ${CLI_PROXY_API_IMAGE:-eceasy/cli-proxy-api:v8.0.23}
    pull_policy: missing
    container_name: cliproxyapi-official-copilot-dev
    restart: unless-stopped
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:?generate .runtime/secrets.env first; see docs/claude-code-setup.md}
      TZ: UTC
    ports:
      - "127.0.0.1:8317:8317"
    volumes:
      - ./.runtime/config.yaml:/CLIProxyAPI/config.yaml:ro
      - type: bind
        source: ./.cache/native-host/linux/amd64/cli-proxy-api
        target: /CLIProxyAPI/CLIProxyAPI
        read_only: true
        bind:
          create_host_path: false
      - ./build/plugins:/CLIProxyAPI/plugins:ro
      - ./logs:/CLIProxyAPI/logs
      - cliproxyapi-home:/root/.cli-proxy-api
    security_opt:
      - no-new-privileges:true

volumes:
  cliproxyapi-home:
    name: cliproxyapi_official_copilot_dev_home

name: cliproxyapi-official-copilot-dev

services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:7.2.118
    pull_policy: missing
    container_name: cliproxyapi-official-copilot-dev
    restart: unless-stopped
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:?run scripts/bootstrap.sh first}
      TZ: UTC
    ports:
      - "127.0.0.1:8317:8317"
    volumes:
      - ./.runtime/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./build/plugins:/CLIProxyAPI/plugins:ro
      - ./logs:/CLIProxyAPI/logs
      - cliproxyapi-home:/root/.cli-proxy-api
    security_opt:
      - no-new-privileges:true

volumes:
  cliproxyapi-home:
    name: cliproxyapi_official_copilot_dev_home
